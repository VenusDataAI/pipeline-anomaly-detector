[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-anomaly-detector"
version = "0.1.0"
description = "ML-based anomaly detection system for data pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pipeline Anomaly Detector Contributors" }]
keywords = ["anomaly-detection", "data-pipelines", "machine-learning", "dbt", "airflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
    "joblib>=1.3",
    "typer>=0.9",
    "rich>=13.7",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "notebook>=7.1",
]
airflow = [
    "apache-airflow>=2.8",
]

[project.scripts]
pad = "pipeline_anomaly_detector.cli.main:app"

[project.urls]
Homepage = "https://github.com/your-org/pipeline-anomaly-detector"
Repository = "https://github.com/your-org/pipeline-anomaly-detector"
"Bug Tracker" = "https://github.com/your-org/pipeline-anomaly-detector/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline_anomaly_detector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["pipeline_anomaly_detector"]
omit = ["tests/*"]
